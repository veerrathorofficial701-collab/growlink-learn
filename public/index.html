<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>GROLINQ — Trusted Link Building Partner for Digital Agencies</title>
    <meta name="description" content="GROLINQ is a data-driven link-building marketplace connecting brands and agencies with 80,000+ high-authority publishers worldwide. Grow your SEO with strategic PR and backlinks." />
    <meta name="keywords" content="link building, backlinks, SEO, digital marketing, PR, grolinq, agency" />
    <meta name="author" content="GROLINQ" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/img/logo/favicon.png" />
    <link rel="apple-touch-icon" href="/img/logo/favicon.png" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://grolinq.netlify.app/" />
    <meta property="og:title"       content="GROLINQ — Trusted Link Building Partner" />
    <meta property="og:description" content="Data-driven link-building marketplace. Access 80,000+ publishers, transparent pricing, and intelligent automation — all from one platform." />
    <meta property="og:image"       content="https://grolinq.netlify.app/img/logo/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="GROLINQ — Trusted Link Building Partner" />
    <meta name="twitter:description" content="Data-driven link-building marketplace. Access 80,000+ publishers worldwide." />
    <meta name="twitter:image"       content="https://grolinq.netlify.app/img/logo/logo.png" />

    <!-- Theme colour (mobile browser bar) -->
    <meta name="theme-color" content="#000000" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
